{% extends "base.html" %}

{% block title %}Страница не найдена (404) — Bikely{% endblock %}

{% block content %}
<div class="not-found">
    <div class="not-found-icon" aria-hidden="true">🚲</div>

    <p class="not-found-code">404</p>

    <h1 class="h3 mb-3">Страница не найдена</h1>

    <p class="text-secondary mb-4">
        К сожалению, запрашиваемая страница не существует,
        была удалена или перемещена по другому адресу.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-2">
        <a class="btn btn-bikely" href="{% url 'web_main:index' %}">
            На главную
        </a>
        <a class="btn btn-outline-primary" href="{% url 'web_bikes:list' %}">
            К велосипедам
        </a>
        <a class="btn btn-outline-secondary" href="{% url 'web_rentals:list' %}">
            К арендам
        </a>
    </div>
</div>
{% endblock %}
