
{% if rental.status == rental.Status.ACTIVE %}
    <span class="status status-muted">
        Аренда активна
    </span>
{% elif rental.status == rental.Status.COMPLETED %}
    <span class="status status-active">
        Аренда завершена
    </span>
{% elif rental.status == rental.Status.CANCELLED %}
    <span class="status status-cancelled">
        Аренда отменена
    </span>
{% endif %}
