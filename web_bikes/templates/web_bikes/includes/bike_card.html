
<div class="col-md-6 col-lg-4">
    <article class="data-card h-100">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <span class="bike-icon">🚲</span>

            {% if bike.is_available %}
                <span class="status status-active">Доступен</span>
            {% else %}
                <span class="status status-muted">В прокате</span>
            {% endif %}
        </div>

        <div class="mt-3">
            <div class="small text-secondary">
                Велосипед №{{ bike.id }}
            </div>

            <h3>{{ bike.model|default:"Модель не указана" }}</h3>

            <p class="text-secondary mb-3">
                {{ bike.get_type_display|default:"Тип не указан" }}
            </p>

            <a class="text-link" href="{% url 'web_bikes:detail' bike.id %}">
                Подробнее о велосипеде →
            </a>
        </div>
    </article>
</div>
