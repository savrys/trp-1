
<article class="station-card">
    <div class="station-pin">⌖</div>

    <div>
        <h3>{{ station.name }}</h3>

        <p>
            Вместимость: {{ station.capacity }} мест
        </p>

        {% if station.is_large %}
            <span class="status status-active">Крупная станция</span>
        {% endif %}
    </div>
</article>
